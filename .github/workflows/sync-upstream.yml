# Keep a fork's master in step with deepseek-ai/deepseek-harness master. The job
# calls GitHub's merge-upstream endpoint, which fast-forwards master when the fork
# carries no commits of its own and otherwise records a merge commit; a conflict
# fails the run (HTTP 409) and leaves master untouched for a manual merge.
#
# GitHub refuses a push through GITHUB_TOKEN that changes .github/workflows/, so
# upstream commits touching workflows need the UPSTREAM_SYNC_TOKEN secret: a
# fine-grained token for this fork with Contents and Workflows read/write.
# Without the secret the job falls back to GITHUB_TOKEN.
name: Sync upstream

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync master from upstream
    if: github.repository != 'deepseek-ai/deepseek-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge upstream master
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          result=$(gh api --method POST "repos/$REPOSITORY/merge-upstream" -f branch=master)
          echo "$result"
          {
            echo '### Upstream sync'
            echo
            echo "$result" | jq -r '"- merge type: \(.merge_type)\n- base branch: \(.base_branch)\n- message: \(.message)"'
          } >> "$GITHUB_STEP_SUMMARY"
